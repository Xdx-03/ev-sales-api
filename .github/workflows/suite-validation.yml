name: Suite validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: suite-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-collection:
    name: Code quality and API suite collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_commit_messages.py "$BASE_SHA" "$HEAD_SHA"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q ev_api tests scripts run_api_tests.py
      - run: bash -n scripts/check_linux_test_env.sh
      - run: python scripts/validate_postman_assets.py
      - run: python -m pytest --collect-only -q
      - run: python -m pytest --collect-only -q -m "not destructive and not database"
