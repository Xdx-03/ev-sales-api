# Public template only. Inject credentials with EV_* environment variables;
# do not commit real accounts, passwords, webhooks, or report links.
default:
  base_url: "http://localhost:8080"
  timeout: 10
  accounts:
    customer:
      username: ""
      password: ""
    admin:
      username: ""
      password: ""
  # Optional read-only database account for explicit API-DB checks.
  database:
    host: ""
    port: 3306
    name: ""
    username: ""
    password: ""
    # Required for non-loopback hosts. Must point to the trusted MySQL CA certificate.
    ssl_ca: ""
  business_data:
    nonexistent_order_id: 999999999
    model_id: 1
    sku_id: null
    # Two different completed appointments owned by the customer, both without feedback.
    completed_test_drive_id_rating_0: null
    completed_test_drive_id_rating_6: null
    vin: ""
    ai_question: "预算25万，推荐一款续航较高、适合家用的新能源车"
    ai_min_reply_length: 8
  feishu:
    webhook: ""
    report_url: ""
