[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers -p no:asyncio
markers =
    api: black-box API tests
    regression: scenarios included in the regression suite
    critical: high-risk scenarios that must block a release
    slow: scenarios with long-running external dependencies
    ui: reserved for future UI tests; currently unused
    smoke: core public API smoke tests
    auth: login and token tests
    permission: permission and unauthorized access tests
    boundary: parameter boundary tests
    business: authenticated business regression tests
    destructive: tests that create or update business data
    database: explicit read-only API-to-database consistency checks
    ai: AI shopping guide API and conversation tests
